services:
  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasktrail-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/app:/app/app
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tasktrail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and vector memory
  redis:
    image: redis:7-alpine
    container_name: tasktrail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - tasktrail-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tasktrail-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tasktrail-network

  # Admin Frontend (separate from main app)
  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    container_name: tasktrail-admin
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_APP_MODE=admin
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tasktrail-network

volumes:
  redis_data:
    driver: local

networks:
  tasktrail-network:
    driver: bridge
